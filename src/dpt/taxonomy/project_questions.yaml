# Question archetypes for the project deck. One card is created per
# (project x archetype). The proposer reads the actual repo and turns the archetype
# into something concrete -- generic questions are worthless here.

# Fixed across all questions so a dimension can be trended over weeks.
rubric_dimensions:
  - correctness
  - specificity
  - tradeoff-awareness
  - structure
  - conciseness

archetypes:
- id: design-tradeoff
  name: Core design tradeoff
  prompt_seed: >
    Pick a concrete structural decision visible in the code and ask why it was made,
    naming the specific alternative that was passed over.
  rubric_focus: [tradeoff-awareness, specificity]

- id: why-not-alternative
  name: Why not X instead
  prompt_seed: >
    Name a plausible alternative technology or approach and ask the candidate to
    defend not using it. Push on the cost they accepted.
  rubric_focus: [tradeoff-awareness, correctness]

- id: failure-modes
  name: Failure modes
  prompt_seed: >
    Ask what happens when a specific dependency, network call, or invariant fails.
  rubric_focus: [correctness, specificity]

- id: scaling
  name: Scaling behavior
  prompt_seed: >
    Ask what breaks first at 10x or 100x the current load, and why that component.
  rubric_focus: [correctness, tradeoff-awareness]

- id: testing-strategy
  name: Testing strategy
  prompt_seed: >
    Ask what is and isn't tested, and how they decided where the line falls.
  rubric_focus: [structure, specificity]

- id: hardest-bug
  name: Hardest bug in this project
  prompt_seed: >
    Ask for the hardest bug they hit here and how they found it. Probe the method,
    not the outcome.
  rubric_focus: [structure, specificity]

- id: data-model
  name: Data model / schema decisions
  prompt_seed: >
    Ask why the data is shaped this way and what a change to it would cost.
  rubric_focus: [correctness, tradeoff-awareness]

- id: security-boundary
  name: Trust and security boundaries
  prompt_seed: >
    Ask where untrusted input enters and what happens to it.
  rubric_focus: [correctness, specificity]

- id: what-would-you-redo
  name: What would you do differently
  prompt_seed: >
    Ask what they'd change with hindsight, and push for the reason it wasn't obvious then.
  rubric_focus: [tradeoff-awareness, structure]

- id: walkthrough
  name: End-to-end walkthrough
  prompt_seed: >
    Ask them to trace one concrete request or operation through the whole system.
  rubric_focus: [structure, conciseness]

- id: why-this-layer-exists
  name: Why this layer exists
  prompt_seed: >
    Pick a layer or secondary component (a router, a client library, a wrapper) and
    ask what a caller would have to know or do if it didn't exist. Push past the
    surface answer to the specific state it hides or the responsibility only it owns.
  rubric_focus: [correctness, specificity]

- id: compatibility-constraints
  name: Choices forced by compatibility
  prompt_seed: >
    Find a place where the project stands in for, wraps, or talks to an existing
    system or protocol. Ask which design choices exist only to stay compatible with
    it, and what would break for an existing caller if it had been done differently.
  rubric_focus: [tradeoff-awareness, specificity]

- id: guarantee-vs-heuristic
  name: Guarantees versus tuned heuristics
  prompt_seed: >
    Ask which behaviors are hard guarantees and which are tuned heuristics. Push for
    the concrete bound the guarantee gives, and how it still holds when the
    heuristic's weights are wrong.
  rubric_focus: [correctness, tradeoff-awareness]

- id: current-status
  name: What actually works today
  prompt_seed: >
    Ask how far along the project is, then pick one capability it claims and ask
    whether that has run for real or only in tests or on paper. Probe any claim the
    code or docs don't back up.
  rubric_focus: [correctness, specificity]
