[project]
name = "dpt"
version = "0.1.0"
description = "TUI trainer for debug-round and project-grilling software interviews"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 3 -- the project-QA voice flow.
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
]

[project.scripts]
dpt = "dpt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpt"]
